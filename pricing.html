<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing | Flowvix AI Agency</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="assets/js/config/tailwind.config.js"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="assets/js/checkout.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-surface text-on-surface">
    <!-- Navigation (Copied from index) -->
    <nav class="fixed top-0 w-full z-50 bg-[#090e19]/60 backdrop-blur-xl shadow-[0px_24px_48px_rgba(0,0,0,0.4)]">
        <div class="flex justify-between items-center px-8 py-4 max-w-7xl mx-auto">
            <a href="index.html" class="flex items-center gap-3">
                <span class="text-2xl font-bold tracking-tighter text-[#e7eafb] font-headline">Flowvix</span>
            </a>
            <div class="hidden md:flex items-center gap-8 font-headline tracking-tight">
                <a class="text-[#a6abba] hover:text-[#e7eafb] transition-colors" href="index.html">Home</a>
                <a class="text-[#a6abba] hover:text-[#e7eafb] transition-colors" href="service.html">Services</a>
                <a class="text-[#a6abba] hover:text-[#e7eafb] transition-colors" href="edge.html">Edge</a>
                <a class="text-[#0084FF] font-bold border-b-2 border-[#0084FF] pb-1" href="pricing.html">Pricing</a>
                <a class="text-[#a6abba] hover:text-[#e7eafb] transition-colors" href="admin.html">Admin</a>
            </div>
            <button class="signature-gradient text-on-primary-fixed px-6 py-2.5 rounded-lg font-bold">
                Get Started
            </button>
        </div>
    </nav>

    <main class="pt-32 pb-20 px-8 max-w-7xl mx-auto">
        <div class="text-center space-y-4 mb-16">
            <h1 class="text-5xl md:text-7xl font-headline font-bold tracking-tighter">Choose Your <span class="text-transparent bg-clip-text signature-gradient">Plan</span></h1>
            <p class="text-on-surface-variant text-xl max-w-2xl mx-auto">Scalable AI solutions for every stage of your business growth.</p>
        </div>

        <div id="pricing-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Packages will be loaded here -->
        </div>
    </main>

    <script>
        async function loadPackages() {
            try {
                const response = await fetch('/api/packages');
                const savedPackages = await response.json();
                
                const grid = document.getElementById('pricing-grid');
                grid.innerHTML = '';

                if (savedPackages.length === 0) {
                    grid.innerHTML = '<p class="col-span-3 text-center text-on-surface-variant">No packages available yet. Please add them in the admin panel.</p>';
                    return;
                }

                savedPackages.forEach(pkg => {
                    const card = document.createElement('div');
                    card.className = `bg-[#090e19] border ${pkg.popular ? 'border-primary' : 'border-outline-variant/20'} rounded-3xl p-8 flex flex-col relative overflow-hidden`;
                    
                    if (pkg.popular) {
                        card.innerHTML += `<div class="absolute top-4 right-[-30px] rotate-45 bg-primary text-white text-[10px] font-bold py-1 px-10">BEST VALUE</div>`;
                    }

                    card.innerHTML += `
                        <div class="mb-8">
                            <h3 class="text-2xl font-bold mb-2">${pkg.name}</h3>
                            <div class="flex items-baseline gap-1">
                                <span class="text-4xl font-bold">$${pkg.price}</span>
                                <span class="text-on-surface-variant">/mo</span>
                            </div>
                        </div>
                        <ul class="space-y-4 mb-10 flex-grow">
                            ${pkg.features.map(f => `
                                <li class="flex items-center gap-3">
                                    <span class="w-1.5 h-1.5 rounded-full bg-[#0084FF] shadow-[0_0_8px_rgba(0,132,255,0.6)]"></span>
                                    <span class="text-on-surface-variant text-sm font-body">${f}</span>
                                </li>
                            `).join('')}
                        </ul>
                        <a href="mailto:contact@flowvix.com?subject=Inquiry for ${pkg.name} Package" class="w-full text-center ${pkg.popular ? 'signature-gradient' : 'bg-surface-container-highest border border-outline-variant/30'} text-white font-bold py-4 rounded-xl transition-all hover:scale-[1.02]">
                            Get Started
                        </a>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading packages:', error);
            }
        }
        loadPackages();
    </script>
</body>
</html>
